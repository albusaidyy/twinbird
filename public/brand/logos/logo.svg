<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Emerald Radial Gradient Base -->
    <radialGradient id="emeraldBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1f4b38" />
      <stop offset="65%" stop-color="#133526" />
      <stop offset="100%" stop-color="#0b2218" />
    </radialGradient>

    <!-- Warm Golden Gradient for Highlights -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Darker Gold Gradient for 3D Needle Shading -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Subtle Drop Shadow under needles -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Emerald Rounded Squircle Card with Transparent Outer Background -->
  <rect width="512" height="512" rx="112" fill="url(#emeraldBg)" />

  <!-- 2. Concentric Gold Rings -->
  <!-- Outer subtle gold ring -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldLight)" stroke-width="4.5" opacity="0.5" />
  <!-- Middle primary gold ring -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#goldLight)" stroke-width="5" opacity="0.85" />
  <!-- Inner thin gold ring -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#goldLight)" stroke-width="2.5" opacity="0.4" />

  <!-- 3. Thin Diagonal Rays (NE, NW, SE, SW) -->
  <g stroke="url(#goldLight)" stroke-width="3" opacity="0.75">
    <line x1="140" y1="140" x2="256" y2="256" />
    <line x1="372" y1="140" x2="256" y2="256" />
    <line x1="140" y1="372" x2="256" y2="256" />
    <line x1="372" y1="372" x2="256" y2="256" />
  </g>

  <!-- 4. 3D Compass Star Needles (North, South, East, West) with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- NORTH NEEDLE (Pointing Up) -->
    <polygon points="256,64 256,256 230,256" fill="url(#goldLight)" />
    <polygon points="256,64 282,256 256,256" fill="url(#goldDark)" />

    <!-- SOUTH NEEDLE (Pointing Down) -->
    <polygon points="256,448 230,256 256,256" fill="url(#goldLight)" />
    <polygon points="256,448 256,256 282,256" fill="url(#goldDark)" />

    <!-- EAST NEEDLE (Pointing Right) -->
    <polygon points="448,256 256,230 256,256" fill="url(#goldLight)" />
    <polygon points="448,256 256,256 256,282" fill="url(#goldDark)" />

    <!-- WEST NEEDLE (Pointing Left) -->
    <polygon points="64,256 256,230 256,256" fill="url(#goldLight)" />
    <polygon points="64,256 256,256 256,282" fill="url(#goldDark)" />
  </g>

  <!-- 5. Center Core Dial -->
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="62" fill="url(#emeraldBg)" stroke="url(#goldLight)" stroke-width="9" filter="url(#shadow)" />
  <!-- Center Golden Pivot Dot -->
  <circle cx="256" cy="256" r="16" fill="url(#goldLight)" />
</svg>